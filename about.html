<!DOCTYPE html>
<html lang="en">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#000;
    color:white;
}

/* HERO */

.hero{
    background:linear-gradient(135deg,#FFD700,#cfae00);
    color:black;
    text-align:center;
    padding:90px 20px 70px;
}

.hero h1{
    font-size:68px;
    line-height:1.1;
    margin:0 0 25px;
    font-weight:900;
}

.hero p{
    font-size:24px;
    max-width:900px;
    margin:auto;
    line-height:1.5;
}

/* PREMIUM NAVIGATION */

.premium-nav{
    background:#0d0d0d;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:18px;
    padding:22px 15px;
    border-top:2px solid #FFD700;
    border-bottom:1px solid #222;
}

.premium-nav a{
    text-decoration:none;
    color:white;
    font-weight:700;
    font-size:17px;
    padding:16px 28px;
    border-radius:50px;
    background:#161616;
    border:1px solid #2c2c2c;
    transition:0.3s;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
}

.premium-nav a:hover{
    background:#FFD700;
    color:black;
    transform:translateY(-2px);
    box-shadow:0 0 20px rgba(255,215,0,0.5);
}

.premium-nav .active{
    background:#FFD700;
    color:black;
    box-shadow:0 0 25px rgba(255,215,0,0.7);
}

/* ABOUT SECTION */

.section{
    padding:80px 25px;
    max-width:1100px;
    margin:auto;
}

.section h2{
    color:#FFD700;
    font-size:54px;
    margin-bottom:35px;
    text-align:center;
}

.section p{
    font-size:23px;
    line-height:1.9;
    color:#ddd;
    text-align:center;
}

/* VALUES */

.values{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
    gap:30px;
    margin-top:60px;
}

.value-card{
    background:#111;
    border:1px solid #222;
    border-radius:25px;
    padding:35px;
    text-align:center;
    transition:0.3s;
}

.value-card:hover{
    transform:translateY(-8px);
    border-color:#FFD700;
    box-shadow:0 0 20px rgba(255,215,0,0.3);
}

.value-card h3{
    color:#FFD700;
    font-size:30px;
    margin-bottom:20px;
}

.value-card p{
    font-size:18px;
    color:#ccc;
    line-height:1.7;
}

/* STATS */

.stats{
    background:#111;
    padding:70px 20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:30px;
    text-align:center;
}

.stat h3{
    color:#FFD700;
    font-size:60px;
    margin:0;
}

.stat p{
    font-size:20px;
    color:#ddd;
}

/* CONTACT */

.contact{
    padding:80px 20px;
    text-align:center;
    background:#050505;
    border-top:2px solid #FFD700;
}

.contact h2{
    color:#FFD700;
    font-size:58px;
    margin-bottom:40px;
}

.contact p{
    font-size:32px;
    line-height:2;
    color:white;
}

.contact span{
    color:#FFD700;
    font-weight:bold;
}

/* FOOTER */

footer{
    background:#0b0b0b;
    padding:40px 20px;
    text-align:center;
    border-top:1px solid #222;
}

footer p{
    color:#888;
    font-size:18px;
}
